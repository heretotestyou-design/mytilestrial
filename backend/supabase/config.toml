# Supabase local development config for MyTilesTrial.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "mytilestrial"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Set to true in production so users verify their email before signing in.
enable_confirmations = false

# Google sign-in (optional). Fill the env vars, then set enabled = true.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

# The API function verifies the user's JWT itself, because a few routes
# (health, catalog) are public.
[functions.api]
verify_jwt = false
