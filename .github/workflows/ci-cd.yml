name: CI and production deployment

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/api/index.ts
      - run: deno test --allow-env=ALLOWED_ORIGINS supabase/functions/_shared

  gateway:
    runs-on: ubuntu-latest
    env:
      SUPABASE_API_HOST: example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production frontend and NGINX
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify proxy and both frontend replicas
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/gateway-healthz
          for attempt in {1..6}; do
            curl -fsS http://127.0.0.1:8080/healthz
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/landing
          upstream_count=$(docker compose logs gateway | sed -n 's|.* GET /healthz 200 upstream=\([^ ]*\).*|\1|p' | sort -u | wc -l)
          test "$upstream_count" -ge 2
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, gateway]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: mytilestrial-production
      cancel-in-progress: false
    env:
      SUPABASE_API_HOST: ${{ vars.SUPABASE_API_HOST }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
      API_GATEWAY_SHARED_SECRET: ${{ secrets.API_GATEWAY_SHARED_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      GATEWAY_PUBLIC_SCHEME: https
      GATEWAY_TRUSTED_PROXY_CIDR: ${{ vars.GATEWAY_TRUSTED_PROXY_CIDR }}
      GATEWAY_PORT: ${{ vars.GATEWAY_PORT }}
      FRONTEND_REPLICAS: ${{ vars.FRONTEND_REPLICAS }}
      DOCKER_HOST: ssh://mytilestrial-deploy
      FRONTEND_IMAGE: mytilestrial-frontend:${{ github.sha }}
      GATEWAY_IMAGE: mytilestrial-gateway:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Connect to the Docker host
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SSH_HOST" =~ ^[[:alnum:].-]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[[:alnum:]_-]+$ ]]
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mytilestrial_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/mytilestrial_known_hosts
          cat >> ~/.ssh/config <<EOF
          Host mytilestrial-deploy
            HostName $DEPLOY_SSH_HOST
            User $DEPLOY_SSH_USER
            Port $port
            IdentityFile ~/.ssh/mytilestrial_deploy
            UserKnownHostsFile ~/.ssh/mytilestrial_known_hosts
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          docker info --format '{{.ServerVersion}}'
      - name: Build release images
        run: |
          set -euo pipefail
          for name in SUPABASE_API_HOST SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL ADMIN_EMAILS GATEWAY_TRUSTED_PROXY_CIDR; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production configuration for $name"
              exit 1
            fi
          done
          docker compose build
      - name: Deploy Supabase migrations and API
        working-directory: backend
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --yes
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS" > "$config"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$config"
          supabase functions deploy api --use-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Roll out frontend and gateway
        run: |
          set -euo pipefail
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose exec -T gateway wget -q -O - http://127.0.0.1:8080/healthz
          docker compose exec -T gateway wget -q -O - http://127.0.0.1:8080/api/v1/health
          docker compose exec -T gateway wget -q -O /dev/null \
            --header="apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" http://127.0.0.1:8080/api/v1/templates
