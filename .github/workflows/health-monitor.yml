name: App health monitor

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send a test report to the configured test recipient
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MONITOR_SITE_URL: ${{ vars.MONITOR_SITE_URL }}
      MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the application
        if: github.event.schedule == '17 * * * *'
        run: python3 infra/monitoring/health_monitor.py
      - name: Preview the daily report
        if: github.event_name == 'workflow_dispatch' && !inputs.send_test_email
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 infra/monitoring/health_monitor.py --daily
      - name: Send a test health report
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_email
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_GMAIL_ADDRESS: ${{ secrets.MONITOR_GMAIL_ADDRESS }}
          MONITOR_GMAIL_APP_PASSWORD: ${{ secrets.MONITOR_GMAIL_APP_PASSWORD }}
          MONITOR_GMAIL_TEST_RECIPIENT: ${{ secrets.MONITOR_GMAIL_TEST_RECIPIENT }}
        run: python3 infra/monitoring/health_monitor.py --daily --test-email
      - name: Generate and deliver the daily report
        if: github.event.schedule == '37 3 * * *'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_GMAIL_ADDRESS: ${{ secrets.MONITOR_GMAIL_ADDRESS }}
          MONITOR_GMAIL_APP_PASSWORD: ${{ secrets.MONITOR_GMAIL_APP_PASSWORD }}
          MONITOR_GMAIL_RECIPIENT: ${{ secrets.MONITOR_GMAIL_RECIPIENT }}
        run: python3 infra/monitoring/health_monitor.py --daily --send
      - name: Archive health report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-report
          path: health-report.md
          retention-days: 7
