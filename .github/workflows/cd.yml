name: CD

on:
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: Deploy to production after this commit passes staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mytilestrial-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy to staging
    needs: verify
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target: staging
    secrets: inherit

  production:
    name: Promote to production
    needs: staging
    if: inputs.promote_to_production
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target: production
    secrets: inherit
