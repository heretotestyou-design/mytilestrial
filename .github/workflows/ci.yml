name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject committed environment files
        run: |
          set -euo pipefail
          if git ls-files -- '.env' '.env.*' ':(glob)**/.env' ':(glob)**/.env.*' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::Only .env.example files may be committed"
            exit 1
          fi
      - name: Scan Git history with redacted findings
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner .

  frontend-quality:
    name: Frontend code quality
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  backend-quality:
    name: Backend code quality
    needs: frontend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
      - run: deno check supabase/functions/api/index.ts

  frontend-tests:
    name: Frontend test cases
    needs: backend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Vitest
        run: npm test -- --maxWorkers=4 --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/frontend-tests.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: frontend-test-results
          path: ${{ runner.temp }}/frontend-tests.xml

  backend-tests:
    name: Backend test cases
    needs: frontend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Run Deno tests
        run: deno test --allow-env=ALLOWED_ORIGINS --junit-path="$RUNNER_TEMP/backend-tests.xml" supabase/functions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/backend-tests.xml

  gateway-tests:
    name: Production build and gateway test cases
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set disposable build fixtures
        run: |
          printf 'SUPABASE_API_HOST=example.invalid\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Build production frontend and NGINX
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify proxy and both frontend replicas
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/gateway-healthz
          for attempt in {1..6}; do
            curl -fsS http://127.0.0.1:8080/healthz
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/landing
          upstream_count=$(docker compose logs gateway | sed -n 's|.* GET /healthz 200 upstream=\([^ ]*\).*|\1|p' | sort -u | wc -l)
          test "$upstream_count" -ge 2
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
